<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="이름 없는 여정"><meta name="format-detection" content="telephone=no"><meta name="theme-color" content="#18231f"><title>이름 없는 여정 · 모바일 테스트 · 길드 확장</title><style>*{box-sizing:border-box}body{margin:0;background:#101815;color:#eee9da;font:15px/1.65 system-ui,'Malgun Gothic',sans-serif}#app{max-width:520px;min-height:100dvh;margin:auto;background:#19231e;padding:18px 15px 40px}h1{font-size:23px;color:#e5bf80;margin:5px 0 4px}h2{font-size:18px;color:#e4c995;margin:5px 0 12px}small,.muted{color:#b4bcb0}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #3d4e40;padding-bottom:10px;margin-bottom:13px}.panel{background:#26362d;border:1px solid #415748;border-radius:10px;padding:13px;margin:11px 0}.story{white-space:pre-line;min-height:120px}.btn{background:#354f3e;border:1px solid #61745f;border-radius:9px;padding:12px 10px;color:#f8f0dc;font:inherit;cursor:pointer;width:100%;text-align:left;margin:4px 0;min-height:47px}.btn:active{background:#5b795f}.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.grid .btn{font-size:14px;text-align:center}.gold{color:#e5bf80}input,select{width:100%;padding:11px;background:#edf2e9;border:0;border-radius:7px;margin:4px 0 12px;font:inherit;color:#1b2a20}label{display:block}.tag{display:inline-block;font-size:12px;color:#d6dbc9;border:1px solid #697a66;border-radius:15px;padding:1px 9px}.back{background:#273a30}footer{font-size:11px;text-align:center;color:#899c8c;margin-top:25px}button:disabled{opacity:.45}@media(max-width:600px){#app{min-height:100svh;padding-bottom:calc(40px + env(safe-area-inset-bottom));padding-top:calc(18px + env(safe-area-inset-top));}input,select,textarea{font-size:16px}.btn{touch-action:manipulation;-webkit-tap-highlight-color:transparent}body{overflow-wrap:anywhere}}</style></head><body><main id="app"></main><script>
const K='nameless_mobile_v02';const npcs={'엘리노어':{role:'강가의 낚시꾼',likes:['붕어','송어','은빛잉어','황금송어'],lines:['물소리가 들리면 마음이 편해져.','오늘 강가에는 무슨 이야기가 떠내려왔을까?'],secret:'강가 아래에 잠긴 오래된 종에 관한 소문을 들었다.'},'카트린느':{role:'마을의 농부',likes:['순무','감자','호박'],lines:['땅은 서두른다고 더 빨리 자라지 않아요.','봄에는 씨앗을, 가을에는 이야기를 거두지요.'],secret:'오래된 풍년제와 숨겨진 씨앗의 전설을 들었다.'},'프레데릭':{role:'숲의 약초사',likes:['약초','달빛풀','버섯'],lines:['오늘은 숲이 평소보다 조용하군요.','뿌리를 남기면 내년에 다시 만날 수 있어요.'],secret:'달빛 아래에서만 피는 꽃의 위치를 알게 되었다.'},'아킬리즈':{role:'대장장이 견습생',likes:['철광석','구리광석','수정'],lines:['좋은 도구는 주인의 습관을 기억하지.','언젠가 내 이름을 건 검을 만들 거야.'],secret:'폐광 깊은 곳의 빛나는 광맥에 관한 이야기를 들었다.'}};const jobs=['모험가','농부','낚시꾼','약초사','대장장이','상인','요리사','학자','도적','마법사'];const crop={순무:{days:2,cost:5,sell:14},감자:{days:3,cost:8,sell:23},호박:{days:4,cost:12,sell:38}};const sell={붕어:7,송어:13,은빛잉어:36,황금송어:100,산딸기:5,약초:9,버섯:8,달빛풀:45,돌:1,철광석:12,구리광석:10,수정:35,순무:14,감자:23,호박:38};let s=null;let app=document.getElementById('app');function save(){localStorage.setItem(K,JSON.stringify(s))}function esc(x){return String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function btn(t,fn){let b=document.createElement('button');b.className='btn';b.textContent=t;b.onclick=fn;return b}function basic(title,story){app.innerHTML='<header><div><strong class="gold">이름 없는 여정</strong><br><small>모바일 테스트 v0.4</small></div><span class="tag">TEXT RPG</span></header><h2>'+esc(title)+'</h2><div class="panel story">'+esc(story)+'</div>';return app}function add(t,f){app.appendChild(btn(t,f))}function choices(items){let d=document.createElement('div');d.className='grid';items.forEach(([t,f])=>d.appendChild(btn(t,f)));app.appendChild(d)}function homeStart(){basic('당신만의 이야기를 시작하세요','한 번의 선택이 하루가 되고, 그 하루들이 한 사람의 여정이 됩니다.');add('새 게임',create);if(localStorage.getItem(K))add('이어하기',()=>{try{s=JSON.parse(localStorage.getItem(K));normalize();main('저장된 여정을 불러왔습니다.')}catch(e){alert('저장 파일 오류')}});app.insertAdjacentHTML('beforeend','<footer>브라우저에 자동 저장됩니다. 브라우저 데이터 삭제 시 기록이 사라질 수 있습니다.</footer>')}function create(){app.innerHTML='<h1>캐릭터 등록</h1><label>이름<input id="nm" placeholder="이름 입력" value="에델"></label><label>나이<input id="age" value="20"></label><label>성별<input id="sex" value="자유"></label><label>종족<input id="race" value="인간"></label><label>직업<select id="job">'+jobs.map(j=>'<option>'+j+'</option>').join('')+'</select></label>';add('여정 시작',()=>{let name=document.getElementById('nm').value.trim();if(!name)return alert('이름을 입력하세요.');s={name,age:document.getElementById('age').value,gender:document.getElementById('sex').value,race:document.getElementById('race').value,job:document.getElementById('job').value,day:1,gold:100,hp:100,energy:100,level:1,exp:0,inventory:{'순무 씨앗':3,'낚싯대':1},field:[null,null,null,null],skills:{낚시:0,농사:0,채집:0,채광:0,탐구:0},social:{},journal:['1일째: 새로운 삶을 시작했다.'],flags:[]};normalize();save();main('작은 마을에서 새로운 삶이 시작됩니다. 오늘은 무엇을 할까요?')});add('← 돌아가기',homeStart)}function normalize(){s.social=s.social||{};for(let n of Object.keys(npcs))s.social[n]=Object.assign({points:0,talk_day:0,gift_day:0,events:[]},s.social[n]||{});s.inventory=s.inventory||{};s.field=s.field||[null,null,null,null];s.skills=s.skills||{};s.journal=s.journal||[];s.flags=s.flags||[];s.energy??=100;s.day??=1}function main(msg){save();basic('마을의 하루',msg||'오늘은 무엇을 해볼까요?');app.insertAdjacentHTML('beforeend',`<div class="panel"><b class="gold">${esc(s.name)} · ${esc(s.job)} · Lv.${s.level}</b><br><small>${s.day}일째 · ${['봄','여름','가을','겨울'][Math.floor((s.day-1)/28)%4]} · ${s.gold} G · 체력 ${s.hp}/100 · 활력 ${s.energy}/100</small></div>`);choices([['🎣 낚시',()=>work('낚시')],['🌿 채집',()=>work('채집')],['⛏️ 채광',()=>work('채광')],['🧭 탐험',explore],['🌱 농장',farm],['🛒 상점',shop],['👥 주민 관계',npcList],['📜 길드 심부름',guild],['🎒 인벤토리',inventory],['📜 일지',journal],['🌙 휴식 · 다음 날',rest]]);add('저장하고 시작 화면으로',()=>{save();homeStart()})}function rand(a){return a[Math.floor(Math.random()*a.length)]}function item(it,count=1){s.inventory[it]=(s.inventory[it]||0)+count;if(s.inventory[it]<=0)delete s.inventory[it]}function log(x){s.journal.push(s.day+'일째: '+x);s.journal=s.journal.slice(-100)}function work(w){let cost={낚시:15,채집:12,채광:20}[w];if(s.energy<cost)return main('활력이 부족합니다. 휴식을 취하세요.');s.energy-=cost;let it=rand(w==='낚시'?['붕어','붕어','송어','송어','은빛잉어','황금송어']:w==='채집'?['산딸기','약초','버섯','달빛풀']:['돌','철광석','철광석','구리광석','수정']);item(it);s.skills[w]=(s.skills[w]||0)+1+(s.job===({낚시:'낚시꾼',채집:'약초사',채광:'대장장이'}[w])?2:0);gain(10);log(w+' 중 '+it+'을(를) 얻었다.');main(w+'에 성공했습니다!\n\n'+it+' ×1 획득\n'+w+' 숙련도 '+s.skills[w]+' · 경험치 +10')}function gain(x){s.exp+=x;if(s.exp>=s.level*70){s.exp-=s.level*70;s.level++;s.hp=100;log('레벨 '+s.level+' 달성!')}}function explore(){if(s.energy<25)return main('활력이 부족합니다.');s.energy-=25;gain(15);const e=rand([{t:'길 잃은 여행자',d:'숲에서 길을 잃은 여행자를 만났습니다.',opts:[['길을 알려준다',()=>{s.gold+=12;log('여행자를 도왔다.');main('여행자는 고맙다며 12G를 주었습니다.')}],['지나친다',()=>main('여행자를 뒤로하고 길을 나섰습니다.')]]},{t:'버려진 주머니',d:'길가에 작은 주머니가 떨어져 있습니다.',opts:[['주머니를 연다',()=>{s.gold+=18;main('동전 18G를 발견했습니다.')}],['경비대에 맡긴다',()=>{log('주머니를 경비대에 맡겼다.');main('좋은 일을 했습니다.') }]]},{t:'고대 유적의 흔적',d:'낡은 석문 앞에서 희미한 문양을 발견했습니다.',opts:[['조사한다',()=>{s.flags.push('ruins');gain(18);log('유적의 단서를 찾았다.');main('유적의 단서를 찾았습니다. 경험치 +18')}],['돌아간다',()=>main('안전하게 귀환했습니다.')]]}]);basic(e.t,e.d);e.opts.forEach(([t,f])=>add(t,f))}function inventory(){basic('인벤토리',Object.entries(s.inventory).map(([k,v])=>k+' ×'+v).join('\n')||'소지품이 없습니다.');add('← 마을로',()=>main())}function journal(){basic('모험 일지',s.journal.slice(-30).reverse().join('\n')||'기록 없음');add('← 마을로',()=>main())}function rest(){s.day++;s.energy=100;s.hp=100;save();main('푹 쉬고 새로운 아침을 맞았습니다.\n\n'+s.day+'일째가 시작됩니다.')}function farm(){basic('작은 농장','밭 4칸. 씨앗은 상점에서 구매할 수 있습니다.');s.field.forEach((f,i)=>{let t=f?`${f.crop} · ${Math.max(0,crop[f.crop].days-(s.day-f.day))}일 남음`:'빈 밭';add(`${i+1}번 밭 · ${t}`,()=>{if(f){if(s.day-f.day<crop[f.crop].days)return farm();item(f.crop);s.field[i]=null;gain(12);log(f.crop+'을 수확했다.');main(f.crop+'을(를) 수확했습니다.')}else{let opts=Object.keys(crop).filter(c=>s.inventory[c+' 씨앗']>0);basic('씨앗 선택','심을 씨앗을 선택하세요.');opts.forEach(c=>add(c+' 씨앗',()=>{item(c+' 씨앗',-1);s.field[i]={crop:c,day:s.day};main(c+'을(를) 심었습니다.')}));if(!opts.length)add('씨앗이 없습니다. 상점으로',shop);add('← 농장',farm)}})});add('← 마을로',()=>main())}function shop(){basic('마을 상점','씨앗을 사거나 소지품을 팔 수 있습니다.');Object.entries(crop).forEach(([c,d])=>add(`${c} 씨앗 구매 · ${d.cost}G`,()=>{if(s.gold<d.cost)return shopMessage('금화가 부족합니다.');s.gold-=d.cost;item(c+' 씨앗');shopMessage(c+' 씨앗을 구매했습니다.')}));add('물품 판매',()=>{basic('소지품 판매','판매할 아이템을 선택하세요.');let arr=Object.entries(s.inventory).filter(([k,v])=>sell[k]&&v>0);arr.forEach(([k,v])=>add(`${k} ×${v} · 1개 ${sell[k]}G`,()=>{item(k,-1);s.gold+=sell[k];main(k+'을(를) 판매해 '+sell[k]+'G를 받았습니다.')}));add('← 상점',shop)});add('← 마을로',()=>main())}function shopMessage(x){main(x)}function npcList(){basic('마을 주민','이야기를 나누거나 소지품을 선물해 관계를 발전시킬 수 있습니다.');Object.keys(npcs).forEach(n=>{const p=s.social[n].points;add(n+' · '+npcs[n].role+' · '+rank(p)+' ('+p+')',()=>npc(n))});add('← 마을로',()=>main())}function rank(p){return p>=120?'특별한 인연':p>=75?'절친':p>=40?'친구':p>=15?'안면 있는 사이':'낯선 사이'}function npc(n){let a=s.social[n],data=npcs[n];basic(n+' · '+data.role,`현재 관계: ${rank(a.points)} (${a.points}점)\n\n${data.lines[(s.day+n.length)%data.lines.length]}`);add('대화하기 (활력 -5)',()=>{if(a.talk_day===s.day)return notice(n,'오늘은 이미 대화했습니다.');if(s.energy<5)return notice(n,'활력이 부족합니다.');s.energy-=5;a.talk_day=s.day;a.points+=5;log(n+'와 대화했다.');notice(n,n+'와 대화했습니다. 호감도 +5')});add('선물하기',()=>{basic(n+'에게 선물','보유한 아이템 중 하나를 선택하세요.');let entries=Object.entries(s.inventory).filter(([k,v])=>v>0&&!k.endsWith(' 씨앗')&&k!=='낚싯대');entries.forEach(([k,v])=>add(k+' ×'+v,()=>{if(a.gift_day===s.day)return notice(n,'오늘은 이미 선물했습니다.');item(k,-1);a.gift_day=s.day;let p=data.likes.includes(k)?12:3;a.points+=p;notice(n,n+'에게 '+k+'을(를) 선물했습니다. 호감도 +'+p)}));add('← 돌아가기',()=>npc(n))});let next=[15,40,75,120].find(t=>a.points>=t&&!a.events.includes(t));if(next)add('✦ 특별 관계 이벤트',()=>{basic(n+'의 이야기',next>=40?data.secret:n+'가 먼저 자신의 일상을 이야기합니다.');add('진심으로 들어준다',()=>eventEnd(8));add('조심스럽게 답한다',()=>eventEnd(3));function eventEnd(p){a.points+=p;a.events.push(next);log(n+'와 특별한 대화를 나눴다.');notice(n,'특별 이벤트 완료! 호감도 +'+p)}});add('← 주민 목록',npcList)}function notice(n,text){save();basic(n+'과의 만남',text);add('계속 대화하기',()=>npc(n));add('← 마을로',()=>main())}const QUESTS=[
{id:'parcel',title:'배달되지 않은 편지',client:'엘리노어',desc:'길드 게시판에 낡은 봉투가 걸려 있다. 엘리노어에게 전달해 달라는 의뢰다.',reward:28,steps:[{text:'강가에 도착했지만 엘리노어의 모습은 보이지 않는다. 발자국이 갈대밭으로 이어진다.',options:[['발자국을 따라간다',1,'갈대밭에서 엘리노어를 발견했다.'],['여관에 편지를 맡긴다','finish','편지를 안전하게 맡겼다.',15],['편지를 열어 본다',2,'봉투 속에는 오래된 강의 지도가 들어 있다.']]},{text:'엘리노어가 물었다. 「무슨 일로 나를 찾았지?」',options:[['편지를 그대로 건넨다','finish','엘리노어가 고맙다며 답장을 부탁했다.',35],['봉투의 사연을 묻는다','finish','그는 옛 친구의 편지라며 미소 지었다.',28]]},{text:'편지의 비밀을 알게 된 당신. 엘리노어가 봉투를 달라고 손을 내민다.',options:[['사과하고 돌려준다','finish','솔직하게 털어놓자 엘리노어가 편지를 받았다.',12],['내용을 모른 척한다','finish','편지는 전해졌지만 마음이 개운치 않다.',20]]}]},
{id:'seed',title:'사라진 씨앗 자루',client:'카트린느',desc:'카트린느가 잃어버린 씨앗 자루를 찾아 달라고 부탁했다.',reward:30,steps:[{text:'농장 울타리 옆에 자루가 끌린 자국이 보인다. 숲 방향으로 이어진다.',options:[['흔적을 추적한다',1,'흙길의 작은 발자국을 따라갔다.'],['시장에서 새 씨앗을 구한다','finish','직접 씨앗을 사서 대신 건넸다.',10],['돌아가 더 물어본다',2,'카트린느가 아침에 여우를 봤다고 말했다.']]},{text:'새끼 여우가 씨앗 자루 위에서 잠들어 있다.',options:[['조심히 자루를 꺼낸다','finish','여우를 놀라게 하지 않고 씨앗을 되찾았다.',38],['먹이를 놓아 여우를 유인한다','finish','여우가 물러난 틈에 자루를 회수했다.',30]]},{text:'여우가 나타났던 시간은 새벽이었다. 좁은 숲길에서 흔적이 발견된다.',options:[['숲길을 살핀다',1,'여우 굴을 발견했다.'],['농장 주변을 다시 찾는다','finish','울타리 뒤의 여분 씨앗을 찾아 대신 전달했다.',18]]}]},

function questState(){normalize();s.quests=s.quests||{active:null,done:[]};if(!Array.isArray(s.quests.done))s.quests.done=[];return s.quests}
function guild(){const qs=questState();basic('길드 · 심부름 게시판',qs.active?'현재 진행 중인 심부름이 있습니다.':'마을 길드가 작은 의뢰를 모아 두었습니다. 원하는 심부름을 수락하세요.');if(qs.active){let q=QUESTS.find(x=>x.id===qs.active.id);if(q)add('📜 진행 중: '+q.title+' — 이어하기',questScene);add('의뢰 포기하기',()=>{if(confirm('진행 중인 의뢰를 포기할까요?')){qs.active=null;save();guild()}})}else QUESTS.forEach(q=>add((qs.done.includes(q.id)?'✓ 완료 · ':'📌 ')+q.title+' · '+q.client+' · 보상 최대 '+q.reward+'G',()=>questDetail(q.id)));add('← 마을로',()=>main())}
function questDetail(id){let q=QUESTS.find(x=>x.id===id),qs=questState();basic(q.title,`의뢰인: ${q.client}\n\n${q.desc}\n\n선택에 따라 이야기와 보상이 달라집니다.`);if(qs.active)add('진행 중인 다른 의뢰가 있습니다.',guild);else add('수락하기',()=>{qs.active={id,step:0};log('심부름 「'+q.title+'」을 수락했다.');save();questScene()});add('← 게시판으로',guild)}
function questScene(msg){let qs=questState(),act=qs.active;if(!act)return guild();let q=QUESTS.find(x=>x.id===act.id),step=q.steps[act.step];if(!step){qs.active=null;save();return guild()}basic('📜 '+q.title, (msg?msg+'\n\n':'')+step.text);step.options.forEach(([label,next,result,pay])=>add(label,()=>questChoose(next,result,pay)));add('나중에 이어하기',()=>{save();guild()})}
function questChoose(next,result,pay){let qs=questState(),act=qs.active;if(!act)return guild();const q=QUESTS.find(x=>x.id===act.id);if(next==='herbcheck'){if((s.inventory['약초']||0)>0){item('약초',-1);return questFinish(q,42,'가지고 있던 약초를 건네 치료를 도왔다.')}return questScene('가방에 약초가 없어 숲에서 직접 구해야 한다.')}if(next==='finish')return questFinish(q,pay||q.reward,result);act.step=next;log('「'+q.title+'」: '+result);save();questScene(result)}
function questFinish(q,pay,result){let qs=questState();s.gold+=pay;gain(18);qs.done.push(q.id);qs.active=null;log('심부름 「'+q.title+'」 완료: '+result+' 보상 '+pay+'G');save();basic('✅ 심부름 완료',result+'\n\n보상: '+pay+' G\n경험치 +18\n현재 금화: '+s.gold+' G');add('다른 심부름 확인',guild);add('마을로 돌아가기',()=>main())}

function exploreAction(action){let e=s.expedition;if(!e)return expeditionMenu();const cost={search:9,encounter:7,move:6,rush:4}[action];if(s.energy<cost)return statmsg('활력이 부족하다. 지금은 돌아가거나 음식을 먹어야 한다.');s.energy-=cost;const place=e.place;let output='';let advance=false;
 if(action==='search'){let pool=place==='폐광'?['철광석','구리광석','수정','돌']:place==='강변'?['붕어','송어','은빛잉어','돌']:place==='고대유적'?['수정','달빛풀','철광석']:['약초','버섯','산딸기','달빛풀'];let found=rand(pool);item(found);e.loot.push(found);gain(7);output=`돌 틈과 주변을 살펴 ${found}을(를) 발견했다! 경험치 +7.`;if(Math.random()<.22){s.hp=Math.max(1,s.hp-8);output+='\n가시와 날카로운 돌에 긁혀 HP -8.'}}
 else if(action==='encounter'){const events=[{t:'길을 잃은 여행자가 지도 한 장을 내민다.',opts:[['길을 안내해준다',()=>{s.gold+=18;gain(8);expResult('여행자를 무사히 안내하고 18G를 받았다.')}],['지도를 함께 살펴본다',()=>{s.flags.push('map_hint');expResult('옛길의 단서를 기억했다.')}],['길을 재촉한다',()=>expResult('별다른 소득 없이 길을 지나쳤다.')]]},{t:'수풀에서 다친 작은 동물이 떨고 있다.',opts:[['약초로 치료한다',()=>{if(!s.inventory['약초'])return expResult('약초가 없다. 동물은 숲속으로 사라졌다.');item('약초',-1);gain(12);expResult('동물이 안정을 되찾았다. 경험치 +12.')}],['먹이를 놓아둔다',()=>{item('산딸기');expResult('나중에 쓸 수 있도록 산딸기를 발견했다.')}],['거리를 두고 지나간다',()=>expResult('놀라게 하지 않고 조용히 돌아섰다.')]]},{t:'낡은 여행 가방이 쓰러진 마차 곁에 놓여 있다.',opts:[['주인을 찾는다',()=>{s.gold+=12;expResult('마을 상인이 감사의 의미로 12G를 보냈다.')}],['가방을 조심히 조사한다',()=>{item('수정');e.loot.push('수정');expResult('오래된 수정을 발견했다.')}],['손대지 않는다',()=>expResult('의심스러운 가방을 뒤로하고 계속 걷는다.')]]}];let v=rand(events);basic('탐험 중 마주친 사건',v.t);v.opts.forEach(([t,f])=>add(t,f));add('탐험을 종료한다',returnExpedition);save();return}

function returnExpedition(){let e=s.expedition;if(!e)return main();log(e.place+' 탐험 귀환: '+(e.loot.join(', ')||'발견품 없음'));s.expedition=null;save();main(`${e.place}에서 돌아왔습니다.\n\n획득: ${e.loot.join(', ')||'없음'}\n총 탐험 기록 ${e.history.length}건`)}

shop=function(){basic('마을 상점',`현재 금화: ${s.gold} G\n\n씨앗, 여행 장비, 회복 물품, 주민에게 줄 선물을 구매할 수 있습니다.`);add('🛍️ 물품 구매',()=>{basic('물품 구매',`보유 금화 ${s.gold} G · 구매할 물품을 선택하세요.`);Object.entries(GOODS).forEach(([name,price])=>add(`${name} · ${price}G`,()=>{if(s.gold<price){basic('구매 실패','금화가 부족합니다.');add('상점으로',shop);return}s.gold-=price;item(name);save();basic('구매 완료',`${name} ×1 구매!\n남은 금화: ${s.gold} G`);add('계속 구매',shopBuy);add('마을로',()=>main())}));add('← 상점',shop)});add('💰 물품 판매',()=>{basic('물품 판매','판매할 물품을 선택하세요.');Object.entries(s.inventory).filter(([k,v])=>sell[k]&&v>0).forEach(([k,v])=>add(`${k} ×${v} · ${sell[k]}G`,()=>{item(k,-1);s.gold+=sell[k];save();basic('판매 완료',`${k}을(를) 팔아 ${sell[k]}G 획득.`);add('계속 판매',shop);add('마을로',()=>main())}));add('← 상점',shop)});add('← 마을',()=>main())};
function shopBuy(){shop();}
const TOPICS={
 '엘리노어':[['오늘 강가의 일','오늘은 송어가 물살을 거슬러 올라가는 날이야. 기다리다 보면 타이밍이 와.'],['낚시 기술','미끼보다 중요한 건 물살이지. 물 위의 그림자를 봐.'],['떠도는 소문','오래된 종이 강바닥에 가라앉았다고 해. 가끔 소리가 들린다는 사람도 있어.'],['함께 낚시할래?','그럼 나란히 앉아 있자. 물소리만 들어도 괜찮아.']],
 '카트린느':[['마을 소식','시장에 봄맞이 씨앗이 들어왔대요. 사람들이 꽤 들떠 있어요.'],['농사 비결','흙을 너무 자주 뒤집지 마세요. 작물도 쉬어야 하거든요.'],['좋아하는 계절','저는 가을이요. 여름에 들인 정성이 눈에 보이는 계절이니까.'],['일손 돕기','씨앗 정리만 도와줘도 큰 힘이 되겠어요.']],
 '프레데릭':[['숲의 식물','달빛풀은 해가 진 후에 향이 진해집니다. 함부로 뿌리를 캐지 마세요.'],['약초 사용법','잎맥과 향을 먼저 살펴보세요. 닮아 보여도 다른 식물이 많습니다.'],['숲의 비밀','무너진 유적 안에도 작은 식물들이 자랍니다. 사람보다 오래 남은 것들이죠.'],['오늘 기분','조용한 날이군요. 나무가 바람을 막아줘서 좋습니다.']],
 '아킬리즈':[['대장간의 하루','아침부터 망치를 쳤더니 팔이 뻐근하군. 그래도 좋아.'],['좋은 장비','장화와 밧줄은 의외로 중요해. 칼보다 먼저 목숨을 지킬 때가 있어.'],['광산 소문','폐광 안쪽 광맥이 아직 살아 있다는 소문이 있어.'],['꿈에 대하여','언젠가 누구나 알아볼 무기를 만들고 싶어. 이름을 남길 수 있게.']]
};
npc=function(n){let a=s.social[n],data=npcs[n];basic(n+' · '+data.role,`현재 관계: ${rank(a.points)} (${a.points}점)\n\n${data.lines[(s.day+n.length)%data.lines.length]}`);add('💬 대화 주제 선택',()=>npcTopics(n));add('🎁 선물하기',()=>{basic(n+'에게 선물','선물을 골라 주세요.');let entries=Object.entries(s.inventory).filter(([k,v])=>v>0&&!k.endsWith(' 씨앗')&&k!=='낚싯대');entries.forEach(([k,v])=>add(k+' ×'+v,()=>{if(a.gift_day===s.day)return notice(n,'오늘은 이미 선물했습니다.');item(k,-1);a.gift_day=s.day;let p=data.likes.includes(k)?12:['꽃다발','과일 바구니','수제 쿠키','따뜻한 차'].includes(k)?8:3;a.points+=p;save();notice(n,n+'에게 '+k+'을(를) 선물했습니다. 호감도 +'+p)}));add('← 돌아가기',()=>npc(n))});let next=[15,40,75,120].find(t=>a.points>=t&&!a.events.includes(t));if(next)add('✦ 특별 관계 이벤트',()=>{basic(n+'의 이야기',next>=40?data.secret:n+'가 자신의 하루에 관한 이야기를 꺼냅니다.');add('진심으로 들어준다',()=>finish(8));add('조심스럽게 답한다',()=>finish(3));function finish(p){a.points+=p;a.events.push(next);log(n+'와 특별한 대화를 나눴다.');notice(n,'특별 이벤트 완료! 호감도 +'+p)}});add('← 주민 목록',npcList)};
function npcTopics(n){let a=s.social[n],data=npcs[n];basic('💬 '+n+'와의 대화',`오늘은 어떤 이야기를 나눌까요?\n\n대화는 NPC당 하루 한 번 호감도를 올립니다. 이후에는 대화를 다시 볼 수 있습니다.`);TOPICS[n].forEach(([topic,reply],idx)=>add(topic,()=>{let first=a.talk_day!==s.day;if(first&&s.energy<5)return notice(n,'활력이 부족합니다.');if(first){s.energy-=5;a.talk_day=s.day;a.points+=idx===3?7:5;log(n+'와 「'+topic+'」 주제로 대화했다.')}basic(n+' · '+topic,`당신: ${topic}에 대해 이야기하고 싶어.\n\n${n}: 「${reply}」\n\n${first?'호감도 +'+(idx===3?7:5):'오늘은 이미 친밀도 보상을 받았습니다.'}`);save();add('다른 주제 이야기',()=>npcTopics(n));add('주민 화면',()=>npc(n))}));add('← 돌아가기',()=>npc(n))}
// Existing autosaves gain safe defaults lazily.
const oldNormalize=normalize;normalize=function(){oldNormalize();s.expedition??=null;s.hp??=100;s.gold??=100;};
